name: Release Hinge (for Windows)

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hinge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build one-click installer and portable exe
        run: npm run dist

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            $line = "$hash  $($_.Name)"
            Set-Content -Path "$($_.FullName).sha256" -Value $line
            Write-Host $line
          }

      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hinge-Windows-Installer
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          $tag = "v${version}-${{ github.run_number }}"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          }

          $notes = @"
          # Hinge (for Windows) v$version

          Give your Windows desktop a little bend. Close your lid and watch your screen softly fold and blur.

          ### Quick Download & Easy Install:
          - **One-Click Installer (Recommended)**: Download **``Hinge-Windows-Setup-$version.exe``** and double-click to install.
            - Installs automatically in seconds with zero configuration.
            - Installs without requiring Administrator / UAC permissions.
            - Automatically creates Desktop and Start Menu shortcuts and starts Hinge.
          - **Portable Executable**: Download **``Hinge-Windows-Portable-$version.exe``** to run immediately anywhere without installation.

          ### Requirements:
          - Windows 10 or Windows 11 (64-bit)
          - Laptop with built-in lid/inclinometer angle sensor (or use keyboard shortcuts / interactive slider).
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes

          $releaseExists = $false
          try {
            gh release view $tag
            $releaseExists = $true
          } catch {
            $releaseExists = $false
          }

          if (-not $releaseExists) {
            gh release create $tag --target $env:GITHUB_SHA --title "Hinge (for Windows) v$version" --notes-file $notesPath --latest
          }

          gh release upload $tag dist/*.exe dist/*.exe.sha256 --clobber
