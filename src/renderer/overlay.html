<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hinge Desktop Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }
    #gl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
    #capture-video {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <video id="capture-video" autoplay playsinline muted></video>
  <script src="shaders.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
